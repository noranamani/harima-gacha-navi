<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="播磨地域のガチャガチャ店舗公式情報を市町村別に探せる案内サイト。"><title>播磨ガチャ入荷ナビ</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="wrap"><p class="eyebrow">HARIMA GACHA NAVI</p><h1>播磨ガチャ入荷ナビ</h1><p>公式情報を、近くの街から見つけよう。</p></div></header>
<main class="wrap"><section class="intro"><h2>店舗の公式情報をまとめてチェック</h2><p>入荷・再入荷・完売の最新情報は、各店舗の公式発信をご確認ください。掲載店舗は順次追加します。</p><label for="city">市町村で絞り込む</label><select id="city"><option value="">すべての市町村</option></select><label for="search">店舗名で検索</label><input id="search" type="search" placeholder="店舗名を入力"></section>
<section aria-live="polite"><div class="section-head"><h2>公式情報へのリンク</h2><span id="count"></span></div><div id="stores" class="grid"></div></section>
<section class="notice"><h2>情報について</h2><p>本サイトは店舗・メーカーとは独立した非公式の案内サイトです。公式投稿や公式在庫ページへのリンクを提供します。商品ごとの入荷や在庫は保証しません。</p><p>自動収集が認められない情報源にはアクセスせず、更新が確認できていない店舗に「更新あり」と表示しません。</p></section></main><footer><div class="wrap">播磨ガチャ入荷ナビ · 公式情報へのリンク集</div></footer><script src="app.js" defer></script></body></html>
