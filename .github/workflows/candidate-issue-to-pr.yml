name: Candidate issue to PR
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing candidate issue number"
        required: true
        type: string
permissions:
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: store-candidate-intake
  cancel-in-progress: false
jobs:
  intake:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[STORE CANDIDATE]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Accept owner-only candidate issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue_number }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > /tmp/store-issue.json
          node - <<'NODE'
          const fs=require('fs');
          const i=JSON.parse(fs.readFileSync('/tmp/store-issue.json','utf8'));
          if(i.user.login!==process.env.EXPECTED_OWNER||!i.title.startsWith('[STORE CANDIDATE]')||i.pull_request)throw Error('Unauthorized candidate');
          fs.writeFileSync('/tmp/candidate-body.txt',i.body||'');
          NODE
      - name: Validate proposed changes and generated pages
        run: |
          set -euo pipefail
          node scripts/process-store-candidate.cjs
      - name: Create pull request; never auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          BRANCH="auto/candidate-issue-$ISSUE_NUMBER"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add stores.js scripts/generate-city-pages.cjs
          test -n "$(git diff --cached --name-only)"
          git commit -m "data: candidate issue $ISSUE_NUMBER"
          git push origin "$BRANCH"
          printf 'Official primary-source evidence and submitted details: issue #%s\nIntake validation passed. Manual/independent CI review required before merge.\n' "$ISSUE_NUMBER" > /tmp/pr-body.txt
          gh pr create --base main --head "$BRANCH" --title "候補店舗の追加（Issue #$ISSUE_NUMBER）" --body-file /tmp/pr-body.txt
