name: Check official page metadata
on:
  schedule:
    - cron: '7 * * * *' # Hourly: metadata plus approved product-link diff
    - cron: '22,37,52 * * * *' # Other metadata runs (every 15 minutes in total)
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Human / Cloudflare 15-minute fallback
        type: choice
        options: [manual, cloudflare_backup]
        default: manual
      product_refresh:
        description: Only Cloudflare's hourly slot may refresh product names
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: harima-gacha-official-metadata
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect metadata
        run: node scripts/check-page-updates.cjs
      - name: Collect official product names and links hourly
        if: github.event.schedule == '7 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.trigger_source != 'cloudflare_backup' || inputs.product_refresh == true))
        run: |
          node --check scripts/collect-official-product-links.cjs
          node scripts/collect-official-product-links.cjs
      - name: Compare approved product links hourly
        if: github.event.schedule == '7 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.trigger_source != 'cloudflare_backup' || inputs.product_refresh == true))
        run: |
          node --check scripts/build-product-link-diff.cjs
          node scripts/build-product-link-diff.cjs
      - name: Commit status if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/page-status.json data/product-links-input.json
          for file in data/product-links-snapshot.json data/product-links-diff.json; do
            if test -f "$file"; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official page metadata"
            git push
          fi
