name: Check official page metadata
on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes (UTC); GitHub may delay scheduled runs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect metadata
        run: node scripts/check-page-updates.cjs
      - name: Commit status if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/page-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official page metadata"
            git push
          fi
