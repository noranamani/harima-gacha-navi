name: Verify public Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-cloudflare-pages.cjs'
      - 'scripts/verify-cloudflare-live.cjs'
      - '.github/workflows/verify-cloudflare-live.yml'
  workflow_dispatch:
    inputs:
      production:
        description: Verify indexing and canonical after confirmed cutover
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose public endpoint responses
        run: |
          node --input-type=module <<'JS'
          const base="https://harima-gacha-navi.pages.dev/";
          for(const url of [base,base+"about",base+"data/page-status.json",base+"data/product-links-history.json","https://raw.githubusercontent.com/noranamani/harima-gacha-navi/main/data/page-status.json","https://noranamani.github.io/harima-gacha-navi/data/page-status.json"]){
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(12000),headers:{"Cache-Control":"no-cache"}});
              const text=await r.text();let summary={};
              try{const b=JSON.parse(text);summary={error:b.error,reasons:b.reasons,lastCheckedAt:b.lastCheckedAt,lastComparedAt:b.lastComparedAt};}catch{summary={htmlTitle:text.match(/<title>([^<]*)<\/title>/i)?.[1],bodyStart:r.ok?undefined:text.slice(0,200)};}
              console.log(JSON.stringify({url,status:r.status,contentType:r.headers.get("content-type"),finalUrl:r.url,cors:r.headers.get("access-control-allow-origin"),...summary}));
            }catch(e){console.log(JSON.stringify({url,error:e.message}));}
          }
          JS
      - name: Compare public Cloudflare and GitHub source JSON
        run: |
          for attempt in 1 2 3 4; do
            if node scripts/verify-cloudflare-live.cjs --production; then exit 0; fi
            if [ "$attempt" != 4 ]; then sleep 30; fi
          done
          exit 1
      - name: Verify production SEO and public pages
        if: inputs.production == true
        run: node scripts/verify-cloudflare-live.cjs --production
